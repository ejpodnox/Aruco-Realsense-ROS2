/aruco_node:
    ros__parameters:
        # Aruco detection parameters
        marker_size: 0.05 # Size of the markers in meters
        aruco_dictionary_id: DICT_4X4_50 # Aruco dictionary type
        enable_board_fusion: false # Enable fused pose estimation from multiple configured board markers
        board_config_file: "" # Absolute or workspace-relative path to the rigid board YAML file
        board_pose_topic: /aruco/board_pose # Output topic for the fused board pose
        board_min_markers: 2 # Minimum number of visible configured board markers for fused pose publication
        board_pose_refine: true # Refine the fused board pose with Levenberg-Marquardt when available
        # Input topics
        image_topic: /camera/color/image_raw # Input image topic
        use_depth_input: false # Use depth image for 3D pose estimation
        depth_image_topic: /camera/depth/image_rect_raw # Input depth image topic
        camera_info_topic: /camera/color/camera_info # Input camera info topic with camera intrinsic parameters
        camera_frame: camera_color_frame # Camera link frame of reference
        # Output topics
        detected_markers_topic: /aruco/markers # Output topic with detected markers (aruco poses + ids)
        markers_visualization_topic: /aruco/poses # Output topic with visualization of detected markers as pose array
        output_image_topic: /aruco/image # Output topic with visualization of detected markers drawn on image
